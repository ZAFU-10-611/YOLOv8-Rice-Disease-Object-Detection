# YOLOv8X with PSA (Position-Sensitive Attention)
# ⭐ 超大模型 + 最强注意力机制

nc: 80  # number of classes
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]    # ⭐ X体量

# YOLOv8X backbone with PSA
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [80, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [160, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [160, True]]
  - [-1, 1, Conv, [320, 3, 2]] # 3-P3/8
  - [-1, 12, C2fPSA, [320, True]]  # ⭐ P3层 + PSA
  - [-1, 1, Conv, [640, 3, 2]] # 5-P4/16
  - [-1, 12, C2fPSA, [640, True]]  # ⭐ P4层 + PSA
  - [-1, 1, Conv, [1280, 3, 2]] # 7-P5/32
  - [-1, 3, C2fPSA, [1280, True]] # ⭐ P5层 + PSA
  - [-1, 1, SPPF, [1280, 5]] # 9

# YOLOv8X head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [640]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [320]] # 15 (P3/8-small)

  - [-1, 1, Conv, [320, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [640]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [640, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1280]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
