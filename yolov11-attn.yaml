# YOLOv11-L with CBAM Attention (Fixed for Ultralytics)
# 存放于项目根目录

nc: 5
depth_multiple: 1.0
width_multiple: 1.0
activation: nn.SiLU()

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 4, C3k2, [256, False]]
  - [-1, 1, CBAM, [7]]                     # P3 后插入 CBAM (kernel_size=7)
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, C3k2, [512, False]]
  - [-1, 1, CBAM, [7]]                     # P4 后插入 CBAM
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[17, 20, 23], 1, Detect, [nc]]